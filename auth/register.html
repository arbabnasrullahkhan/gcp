<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Request Access - GCP Desk</title>
    <link rel="icon" href="../assets/images/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #0f172a; --accent: #4f46e5; --accent-hover: #4338ca; 
            --text-main: #0f172a; --text-secondary: #64748b; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: #e2e8f0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }
        
        .global-spread-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            opacity: 0.80; z-index: -80; pointer-events: none;
        }

        .auth-container { display: flex; width: 100%; height: 100%; }
        
        .auth-left { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; position: relative; z-index: 10; overflow-y: auto; }
        .auth-right { flex: 1; background: var(--primary); display: flex; flex-direction: column; justify-content: center; padding: 60px; color: white; position: relative; overflow: hidden; }
        
        .auth-right::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.4) 0%, transparent 70%);
            z-index: 1; pointer-events: none;
        }

        .auth-box { width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(24px); padding: 48px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); margin: auto; }
        
        .logo-container { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; justify-content: center; }
        .logo-box { width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text { font-family: 'Outfit'; font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        .auth-box h2 { margin: 0 0 8px 0; font-family: 'Outfit'; font-size: 28px; text-align: center; }
        .auth-box p { margin: 0 0 24px 0; color: var(--text-secondary); text-align: center; font-size: 15px; }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-family: 'Inter'; font-size: 15px; color: var(--text-main); outline: none; transition: 0.3s; background: white; }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn-submit { width: 100%; background: #10b981; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Inter'; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
        .btn-submit:hover { background: #059669; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); transform: translateY(-2px); }

        .footer-text { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-secondary); }
        .footer-text a { color: var(--accent); font-weight: 600; text-decoration: none; }

        .hero-title { font-family: 'Outfit'; font-size: 48px; font-weight: 800; line-height: 1.1; margin: 0 0 24px 0; z-index: 2; position: relative; }
        .hero-desc { font-size: 18px; opacity: 0.9; max-width: 400px; line-height: 1.5; z-index: 2; position: relative; }

        #error-msg { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 16px; display: none; font-weight: 500; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }

        @media (max-width: 900px) {
            .auth-right { display: none; }
            .auth-left { padding: 20px; align-items: stretch; justify-content: flex-start; }
            .auth-box { padding: 32px 24px; margin: 0; max-width: 100%; }
        }
        @media (max-width: 500px) {
            .input-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>
    
    <div class="global-spread-bg"></div>

    <div class="auth-container">
        
        <div class="auth-right">
            <h1 class="hero-title">Join the Digital Campus.</h1>
            <p class="hero-desc">Create your account to access course materials, track attendance, and connect with faculty.</p>
            <div style="margin-top:40px; display:flex; gap:12px; z-index:2; position:relative;">
                <div style="width:12px; height:12px; border-radius:50%; background:white; opacity:0.3;"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:white; opacity:1;"></div>
                <div style="width:12px; height:12px; border-radius:50%; background:white; opacity:0.3;"></div>
            </div>
        </div>

        <div class="auth-left">
            <div class="auth-box">
                <div class="logo-container">
                    <div class="logo-box"><img src="../assets/images/logo.png" alt="G" onerror="this.outerHTML='<span style=\'color:var(--accent);font-weight:800;font-size:24px;\'>G</span>'"></div>
                    <div class="logo-text">GCP Desk</div>
                </div>

                <h2>Create Account</h2>
                <p>Register using your official institution details.</p>

                <div id="error-msg"></div>

                <form id="register-form">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" class="input-field" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="input-group">
                            <label>Roll Number / ID</label>
                            <input type="text" class="input-field" id="rollno" placeholder="e.g. CS-24-001" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" class="input-field" id="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" class="input-field" id="password" placeholder="Min 6 characters" required minlength="6">
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">
                        Create Account
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>

                <div class="footer-text">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { auth, db } from '../firebase/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const regForm = document.getElementById('register-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const rollno = document.getElementById('rollno').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            submitBtn.innerHTML = '<span class="skeleton" style="width:20px; height:20px; border-radius:50%; display:inline-block; background:rgba(255,255,255,0.5);"></span> Creating...';
            submitBtn.style.pointerEvents = 'none';
            errorMsg.style.display = 'none';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                
                // Store user data in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    rollNumber: rollno,
                    role: 'student', // Default role for open registration
                    createdAt: new Date().toISOString()
                });

                window.location.href = '../student/dashboard.html';
            } catch (error) {
                submitBtn.innerHTML = `Create Account <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
                submitBtn.style.pointerEvents = 'auto';
                errorMsg.textContent = error.message.replace('Firebase: ', '');
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
