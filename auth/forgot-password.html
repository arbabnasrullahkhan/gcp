<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forgot Password - GCP Desk</title>
    <link rel="icon" href="../assets/images/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #0f172a; --accent: #4f46e5; --accent-hover: #4338ca; 
            --text-main: #0f172a; --text-secondary: #64748b; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: #e2e8f0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }
        
        .global-spread-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            opacity: 0.80; z-index: -80; pointer-events: none;
        }

        .auth-container { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; padding: 20px; }

        .auth-box { width: 100%; max-width: 440px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(24px); padding: 48px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); }
        
        .logo-container { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center; }
        .logo-box { width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text { font-family: 'Outfit'; font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        .auth-box h2 { margin: 0 0 8px 0; font-family: 'Outfit'; font-size: 28px; text-align: center; }
        .auth-box p { margin: 0 0 32px 0; color: var(--text-secondary); text-align: center; font-size: 15px; line-height: 1.5; }

        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; font-family: 'Inter'; font-size: 15px; color: var(--text-main); outline: none; transition: 0.3s; background: white; }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Inter'; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { background: var(--accent-hover); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); transform: translateY(-2px); }

        .footer-text { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-secondary); }
        .footer-text a { color: var(--accent); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

        #msg { font-size: 13px; text-align: center; margin-bottom: 16px; display: none; font-weight: 500; padding: 10px; border-radius: 8px; }
        .msg-error { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .msg-success { color: #10b981; background: rgba(16, 185, 129, 0.1); }

        @media (max-width: 500px) {
            .auth-box { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    
    <div class="global-spread-bg"></div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-container">
                <div class="logo-box"><img src="../assets/images/logo.png" alt="G" onerror="this.outerHTML='<span style=\'color:var(--accent);font-weight:800;font-size:24px;\'>G</span>'"></div>
                <div class="logo-text">GCP Desk</div>
            </div>

            <h2>Reset Password</h2>
            <p>Enter the email address associated with your account and we'll send you a link to reset your password.</p>

            <div id="msg"></div>

            <form id="reset-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" class="input-field" id="email" placeholder="student@college.edu" required>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    Send Reset Link
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>

            <div class="footer-text">
                <a href="login.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from '../firebase/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const resetForm = document.getElementById('reset-form');
        const msgDiv = document.getElementById('msg');
        const submitBtn = document.getElementById('submit-btn');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            submitBtn.innerHTML = '<span class="skeleton" style="width:20px; height:20px; border-radius:50%; display:inline-block; background:rgba(255,255,255,0.5);"></span> Sending...';
            submitBtn.style.pointerEvents = 'none';
            msgDiv.style.display = 'none';
            msgDiv.className = '';

            try {
                await sendPasswordResetEmail(auth, email);
                msgDiv.textContent = 'Password reset email sent! Check your inbox.';
                msgDiv.classList.add('msg-success');
                msgDiv.style.display = 'block';
                submitBtn.innerHTML = 'Email Sent ✓';
            } catch (error) {
                submitBtn.innerHTML = `Send Reset Link <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
                submitBtn.style.pointerEvents = 'auto';
                msgDiv.textContent = error.message.replace('Firebase: ', '');
                msgDiv.classList.add('msg-error');
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
